    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah - Studio IT</title>

</head>
<body>

<div class="header">
    <h1>Studio Unggah</h1>
    <p>Upload file dengan cepat dan aman</p>
</div>

<div class="content">
    <div class="upload-card">
        <div class="upload-icon">📤</div>
        <p id="file-status">Pilih jenis file yang ingin diunggah</p>

        <input type="file" id="input-media" hidden accept="image/*,video/*">
        <input type="file" id="input-bot" hidden accept=".js,.zip,.json,.html">

        <button id="btn-media" class="btn-main btn-gradient">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            Unggah Foto / Video
        </button>

        <button id="btn-bot" class="btn-main btn-outline">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 022 2zM9 9h6v6H9V9z"/>
            </svg>
            Unggah API Bot Baru
        </button>

        <div class="file-info">
            Format didukung: JPG, MP4, JS, ZIP, HTML
        </div>
    </div>
</div>
