<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kontrol Admin - Panel Kontrol IT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="it.css">
</head>
<body>

    <div class="top-nav">
        <div class="top-nav-left">
            <i class="fa-solid fa-bars"></i>
            <span class="top-nav-title">Ruang Kontrol Admin</span>
        </div>
        <div class="top-nav-right">
            <i class="fa-solid fa-pen"></i>
            <i class="fa-solid fa-expand"></i>
            <i class="fa-solid fa-xmark"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </div>

    <div class="tabs-bar">
        <div class="tab-item"><i class="fa-solid fa-file-code"></i> admin.html</div>
        <div class="tab-item active"><i class="fa-solid fa-table-columns"></i> Ruang Kontrol A...</div>
        <div class="tab-item"><i class="fa-solid fa-window-maximize"></i> Halaman HTML</div>
    </div>

    <div class="container">

        <div class="config-card">
            <div class="config-title">
                <i class="fa-brands fa-github"></i> Konfigurasi Kredensial GitHub
            </div>
            <div class="input-group">
                <label>PERSONAL ACCESS TOKEN (PAT)</label>
                <input type="password" id="ghToken" placeholder="Masukkan Token GitHub ghp_...">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="input-group">
                    <label>OWNER / USERNAME</label>
                    <input type="text" id="ghOwner" value="botfebry981-jpg">
                </div>
                <div class="input-group">
                    <label>REPOSITORY NAME</label>
                    <input type="text" id="ghRepo" value="yuzu">
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-header">
                <i class="fa-solid fa-gear"></i> Panel Kontrol IT
            </div>

            <div class="menu-grid">
                <button class="menu-btn"><i class="fa-solid fa-chart-bar"></i> Info</button>
                <button class="menu-btn"><i class="fa-solid fa-plus"></i> Tambah</button>
                <button class="menu-btn active"><i class="fa-solid fa-laptop-code"></i> Studio</button>
                <button class="menu-btn"><i class="fa-solid fa-scroll"></i> Log</button>
            </div>

            <div class="sub-section-title">
                <i class="fa-solid fa-desktop"></i> Studio Kode Cepat
            </div>
            <div class="file-info-text">
                Akses & Edit Skrip (Index.html / app.js / style.css)
            </div>

            <div class="file-selector">
                <div class="file-chip selected" onclick="selectFile('index.html', this)">index.html</div>
                <div class="file-chip" onclick="selectFile('app.js', this)">app.js</div>
                <div class="file-chip" onclick="selectFile('style.css', this)">style.css</div>
            </div>

            <div class="editor-container">
                <textarea class="code-textarea" id="codeEditor" spellcheck="false" placeholder="// Masukkan GitHub token di atas terlebih dahulu untuk memuat skrip asli..."></textarea>
            </div>

            <button class="action-btn" id="btnUpdate" onclick="saveToGitHub()">
                <i class="fa-solid fa-floppy-disk"></i> Amankan & Update Kode
            </button>
        </div>

    </div>

    <div class="bottom-bar">
        <i class="fa-solid fa-pen bottom-icon active"></i>
        <i class="fa-solid fa-folder bottom-icon"></i>
        <i class="fa-solid fa-play bottom-icon"></i>
        <i class="fa-solid fa-terminal bottom-icon"></i>
    </div>

    <div class="toast" id="statusToast">Notifikasi</div>

    <script src="it.js"></script>
</body>
</html>
