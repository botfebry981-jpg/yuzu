<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="admin-header">
        <span class="header-title">Panel Kontrol Pro</span>
        <button class="btn-keluar" onclick="window.location.href='index.html'">Keluar</button>
    </header>

    <main class="container">
        <div id="topStatsArea"></div>
        <div id="mainContentBox" class="main-box-container"></div>
    </main>

    <div class="modal-overlay" id="itModalGateway">
        <div class="modal-box">
            <i class="fa-solid fa-laptop-code" style="font-size:36px; color:#3182ce; margin-bottom:10px;"></i>
            <h3>Konfirmasi Akses IT</h3>
            <p style="font-size:12px; margin:15px 0; color: #718096;">Masuk ke Studio Kode Utama?</p>
            <button onclick="window.location.href='it.html'" class="btn-modal-primary">Masuk Sekarang</button>
            <button onclick="document.getElementById('itModalGateway').style.display='none'" class="btn-modal-secondary">Batal</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn" id="nav-dashboard" onclick="gantiMenu('dashboard')">
            <i class="fa-solid fa-chart-line"></i><span>Dashboard</span>
        </button>
        <button class="nav-btn" id="nav-bot" onclick="gantiMenu('daftar-bot')">
            <i class="fa-solid fa-robot"></i><span>Daftar Bot</span>
        </button>
        <button class="nav-btn nav-btn-center" id="nav-beranda" onclick="gantiMenu('beranda')">
            <i class="fa-solid fa-house"></i><span>Beranda</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='upload.html'">
            <i class="fa-solid fa-cloud-arrow-up"></i><span>Upload</span>
        </button>
        <button class="nav-btn" onclick="document.getElementById('itModalGateway').style.display='flex'">
            <i class="fa-solid fa-code"></i><span>Ruang IT</span>
        </button>
    </nav>

    <script src="admin.js"></script>
</body>
</html>
