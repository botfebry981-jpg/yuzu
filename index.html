<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuzu Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            text-align: center;
            padding: 30px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--tg-theme-button-color, #2481cc);
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Selamat Datang!</h1>
        <p>Aplikasi Mini Telegram <strong>Yuzu</strong> berhasil terhubung dan siap dikembangkan lebih lanjut.</p>
        <button class="btn" id="btn-close">Tutup Aplikasi</button>
    </div>

    <script {keyword="telegram-mini-app-init"}>
        // Inisialisasi Web App Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Membuka aplikasi langsung layar penuh

        // Fungsi tombol tutup
        document.getElementById('btn-close').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
