<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login Telegram Mini App</title>
    
    <!-- SDK Resmi Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Menghubungkan ke Komponen Desain (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
    <h2>Sistem Login</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label>Pilih Hak Akses (Role)</label>
            <select id="roleSelect" required>
                <option value="" disabled selected>Pilih</option>
                <option value="admin">Admin</option>
                <option value="it">IT</option>
                <option value="user">Telegram User</option>
            </select>
        </div>

        <div id="dynamicArea">
            <!-- Kolom Password untuk Admin & IT -->
            <div class="form-group" id="passwordGroup">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan sandi">
            </div>
            
            <!-- Kolom Nama Otomatis untuk User Telegram -->
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Nama Telegram Anda</label>
                <input type="text" id="userNameInput" placeholder="Memuat nama..." readonly>
            </div>
        </div>
        
        <button type="submit" class="btn-login">Lanjutkan</button>
        
        <div id="errorMsg" class="error">Sandi Salah!</div>
    </form>
</div>

<!-- Menghubungkan ke Komponen Logika (JS) -->
<script src="app.js"></script>

</body>
</html>
